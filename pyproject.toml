[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dagdoctor"
version = "0.1.0"
description = "Diagnose failing Airflow tasks, propose minimal fixes as draft PRs, and review DAG code for common anti-patterns."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Bakhtiyor Fakhriddinov" }]
keywords = ["airflow", "data-engineering", "llm", "on-call", "observability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
dagdoctor = "dagdoctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
