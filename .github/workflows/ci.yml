name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check src tests
      - run: pytest -q

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Diagnose and patch the example failure (offline, replayed LLM reply)
        run: >
          dagdoctor fix examples/logs/clickhouse_missing_column.log
          --repo examples --replay-llm examples/llm/missing_column.json
      - name: The good example DAG passes review with no warnings
        run: dagdoctor review examples/dags/shop_daily_sales.py --fail-on warning
